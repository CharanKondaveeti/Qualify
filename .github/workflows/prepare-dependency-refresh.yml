name: Prepare safe dependency refresh

on:
  push:
    branches:
      - security/dependency-refresh-20261020

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout controlled dependency branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/dependency-refresh-20261020
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Remove vulnerable spreadsheet writer
        run: npm uninstall xlsx --package-lock-only
      - name: Upgrade vulnerable runtime packages and add Excel exporter
        run: npm install --save --package-lock-only '@supabase/supabase-js@2' 'axios@1' 'react-router-dom@7' 'write-excel-file@4'
      - name: Apply compatible transitive dependency security fixes
        run: npm audit fix --package-lock-only || true
      - name: Commit generated dependency lockfile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Dependencies already current.'
            exit 0
          fi
          git commit -m 'Refresh runtime dependencies and replace vulnerable XLSX package'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/security/dependency-refresh-20261020
